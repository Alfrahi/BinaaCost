name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup environment variables
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Setup & Boot PocketBase
        run: |
          wget https://github.com/pocketbase/pocketbase/releases/download/v0.39.4/pocketbase_0.39.4_linux_amd64.zip
          unzip -o pocketbase_0.39.4_linux_amd64.zip -d pocketbase
          chmod +x pocketbase/pocketbase
          cd pocketbase
          ./pocketbase migrate up
          ./pocketbase superuser upsert admin@local.dev localdev123
          ./pocketbase serve &
          
          # Wait for PocketBase to start
          echo "Waiting for PocketBase to start..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8090/api/health > /dev/null; then
              echo "PocketBase is up!"
              break
            fi
            sleep 1
          done
          
          if ! curl -s http://127.0.0.1:8090/api/health > /dev/null; then
            echo "PocketBase failed to start."
            exit 1
          fi

      - name: Unit & Integration Tests
        run: pnpm coverage

      - name: Build
        run: pnpm build

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
