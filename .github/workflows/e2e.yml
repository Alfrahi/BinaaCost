name: E2E

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup environment variables
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start PocketBase
        run: |
          wget https://github.com/pocketbase/pocketbase/releases/download/v0.39.4/pocketbase_0.39.4_linux_amd64.zip
          unzip -o pocketbase_0.39.4_linux_amd64.zip -d pocketbase
          chmod +x pocketbase/pocketbase
          cd pocketbase
          ./pocketbase migrate up
          ./pocketbase superuser upsert admin@local.dev localdev123
          ./pocketbase serve --dev &
          
          # Wait for PocketBase to start
          echo "Waiting for PocketBase to start..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8090/api/health > /dev/null; then
              echo "PocketBase is up!"
              break
            fi
            sleep 1
          done
          
          if ! curl -s http://127.0.0.1:8090/api/health > /dev/null; then
            echo "PocketBase failed to start."
            exit 1
          fi

      - name: Start Frontend
        run: |
          pnpm dev &
          
          # Wait for Vite dev server to start
          echo "Waiting for Vite to start..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8080 > /dev/null; then
              echo "Frontend is up!"
              break
            fi
            sleep 1
          done
          
          if ! curl -s http://127.0.0.1:8080 > /dev/null; then
            echo "Frontend failed to start."
            exit 1
          fi

      - name: Run Playwright tests
        run: pnpm e2e --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
