<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline</title>
  <style>
    :root {
      /* Light theme fallback values (match globals.css light theme) */
      --background: 0 0% 100%;
      --foreground: 0 0% 0%;
      --muted: 0 0% 95.3%;
      --muted-foreground: 0 0% 42%;
    }
    .dark {
      --background: 224 71% 4%;
      --foreground: 0 0% 98%;
      --muted: 215 28% 17%;
      --muted-foreground: 215 20% 65%;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .container {
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    p {
      color: hsl(var(--muted-foreground));
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>You are offline</h1>
    <p>Please check your internet connection. Some features may be unavailable.</p>
  </div>
</body>
</html>
